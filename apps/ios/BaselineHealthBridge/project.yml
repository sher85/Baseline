name: BaselineHealthBridge
options:
  minimumXcodeGenVersion: 2.38.0
packages: {}
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.baseline.HealthBridge
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  BaselineHealthBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
    entitlements:
      path: Support/BaselineHealthBridge.entitlements
    settings:
      base:
        PRODUCT_NAME: Baseline Health Bridge
        INFOPLIST_KEY_NSHealthShareUsageDescription: Baseline reads your Apple Health workouts, activity, sleep, and vital summaries so it can sync them into your local Baseline analytics app.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Baseline does not write into Health.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Baseline connects to your Mac on the local network so the iPhone bridge can sync Apple Health data into your local Baseline API.
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        INFOPLIST_KEY_UIBackgroundModes:
          - fetch
          - processing
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
          - com.baseline.HealthBridge.refresh
